<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>11 ACAD D1 - About</title>
<meta name="description" content="About our section and students.">
<link rel="icon" type="image/png" href="./favicon.png">

<style>
  html { background: #05060a; }
  html, body { margin: 0; padding: 0; height: 100%; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Segoe UI', sans-serif;
    color: #f5f5f7;
    position: relative;
    height: 100vh;
    height: 100dvh;
    overflow: hidden;
    -webkit-font-smoothing: antialiased;
    -webkit-user-select: none;
    user-select: none;
    -webkit-touch-callout: none;
  }

  /* Blurred aurora confined to the top of the viewport, fading into a dark base beneath it (same as index.html) */
  body::before { content: ""; position: fixed; z-index: -2; inset: 0; pointer-events: none; background: #05060a; }
  body::after {
    content: "";
    position: fixed;
    z-index: -1;
    left: -22%;
    right: -22%;
    top: -22%;
    height: 85vh;
    pointer-events: none;
    background:
      radial-gradient(ellipse at 15% 16%, rgba(111,20,63,.78) 0%, rgba(111,20,63,0) 42%),
      radial-gradient(ellipse at 79% 18%, rgba(112,65,31,.72) 0%, rgba(112,65,31,0) 39%),
      radial-gradient(ellipse at 18% 78%, rgba(43,23,112,.88) 0%, rgba(43,23,112,0) 43%),
      radial-gradient(ellipse at 78% 78%, rgba(12,49,72,.82) 0%, rgba(12,49,72,0) 42%),
      radial-gradient(ellipse at 49% 45%, rgba(63,22,64,.38) 0%, rgba(63,22,64,0) 45%),
      linear-gradient(145deg, #21101d 0%, #151022 48%, #081722 100%);
    background-size: 145% 145%;
    background-position: 50% 30%;
    filter: blur(62px) saturate(125%);
    opacity: .96;
    -webkit-mask-image: linear-gradient(to bottom, #000 0%, #000 45%, transparent 92%);
    mask-image: linear-gradient(to bottom, #000 0%, #000 45%, transparent 92%);
    transform: translate3d(0,0,0);
    animation: auroraDrift 22s ease-in-out infinite alternate;
  }
  /* Driven purely by transform (no background-position) so the browser only
     has to recomposite an already-blurred layer each frame, not re-blur it. */
  @keyframes auroraDrift {
    0% { transform: translate3d(-3%,1%,0) scale(1.05); }
    35% { transform: translate3d(3%,-1.5%,0) scale(1.12); }
    70% { transform: translate3d(-1.5%,2%,0) scale(1.08); }
    100% { transform: translate3d(2.5%,-0.5%,0) scale(1.14); }
  }
  @media (prefers-reduced-motion: reduce) {
    body::after { animation: none; }
  }
  @media (max-width: 700px) {
    /* Keep the aurora still on phones to reduce ongoing GPU work. */
    body::after {
      animation: none;
      transform: translate3d(-1%, 0.5%, 0) scale(1.08);
      will-change: auto;
    }
  }

  /* Back button, same style as the attendance page */
  .back-btn {
    position: fixed;
    z-index: 1000;
    top: calc(16px + env(safe-area-inset-top, 0px));
    left: max(20px, env(safe-area-inset-left, 0px));
    width: 40px;
    height: 40px;
    border-radius: 50%;
    display: grid;
    place-items: center;
    color: #0a84ff;
    background: rgba(22,24,35,.72);
    border: 1px solid rgba(255,255,255,.12);
    -webkit-backdrop-filter: blur(14px);
    backdrop-filter: blur(14px);
    text-decoration: none;
  }
  .back-btn svg { width: 18px; height: 18px; display: block; }
  .back-btn:active { background: rgba(120,120,128,.24); }
  @media (max-width: 700px) {
    .back-btn { -webkit-backdrop-filter: none; backdrop-filter: none; background: #1c1c1e; }
  }

  /* Polaroids: positioned and rotated by the physics script, draggable */
  /* Polaroids use the whole screen; the frosted panel sits over part of them */
  #stage { position: fixed; left: 0; top: 0; width: 100%; height: 100%; z-index: 1; overflow: hidden; }
  /* Frosted panel: right half on desktop, bottom half on mobile */
  #panel {
    position: fixed;
    right: 0;
    top: 0;
    width: 50%;
    height: 100%;
    z-index: 2;
    background: rgba(10,11,17,.5);
    border-left: 1px solid rgba(255,255,255,.12);
    -webkit-backdrop-filter: blur(14px);
    backdrop-filter: blur(14px);
  }
  @media (max-width: 700px) {
    #panel {
      left: 0;
      right: auto;
      top: auto;
      bottom: 0;
      width: 100%;
      height: 50%;
      border-left: 0;
      border-top: 1px solid rgba(255,255,255,.08);
      background: #07080d;
      -webkit-backdrop-filter: none;
      backdrop-filter: none;
    }
  }
  .polaroid {
    position: absolute;
    left: 0;
    top: 0;
    box-sizing: border-box;
    background: #fdfdfb;
    border-radius: 4px;
    box-shadow: 0 12px 26px rgba(0,0,0,.45), 0 2px 5px rgba(0,0,0,.3);
    will-change: transform;
    cursor: grab;
    touch-action: none;
  }
  .polaroid.dragging {
    cursor: grabbing;
    box-shadow: 0 22px 40px rgba(0,0,0,.55), 0 4px 10px rgba(0,0,0,.3);
  }
  .polaroid .placeholder {
    position: relative;
    width: 100%;
    border-radius: 2px;
    overflow: hidden;
    pointer-events: none;
    background-color: #161616;
    background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='180' height='180'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='3' stitchTiles='stitch'/><feColorMatrix type='saturate' values='0'/><feComponentTransfer><feFuncR type='linear' slope='0.3'/><feFuncG type='linear' slope='0.3'/><feFuncB type='linear' slope='0.3'/></feComponentTransfer></filter><rect width='100%' height='100%' filter='url(%23n)' opacity='0.25'/></svg>");
    background-size: 180px 180px;
  }
  .polaroid .photo {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    object-fit: cover;
    opacity: 0;
    transition: opacity .9s ease;
    pointer-events: none;
    -webkit-user-drag: none;
  }
  .polaroid .photo.loaded { opacity: 1; }
  @media (max-width: 700px) {
    .polaroid { box-shadow: 0 3px 6px rgba(0,0,0,.35); }
    .polaroid.dragging { box-shadow: 0 8px 14px rgba(0,0,0,.4); }
  }
</style>
</head>
<body>

<a class="back-btn" href="index.html" aria-label="Back to home">
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg>
</a>

<div id="stage" aria-label="Polaroid photos"></div>
<div id="panel" aria-hidden="true"></div>

<script>
(function(){
  var MOBILE = Math.min(window.innerWidth, window.innerHeight) <= 500 || window.matchMedia("(pointer: coarse)").matches;
  var COUNT = MOBILE ? 10 : 60;         // polaroids at the start (photos repeat to fill this)
  var SOLID_SHARE = 0.65;               // share that bump into each other; the rest overlap freely
  var SPAWN_DELAY = MOBILE ? [2000, 3500] : [385, 920];  // ms between new polaroids (the stream never stops)
  var MAX_ITEMS = MOBILE ? 14 : 60;     // most polaroids on screen at once
  var SPAWN_MARGIN = 80;                // px above the top edge where new polaroids start
  var HOLD_GROW = 1.12;                 // a held polaroid is this many times bigger
  var PHOTO_FOLDER = "polaroid/";
  var PHOTO_EXTS = ["png", "PNG", "jpeg", "JPEG", "jpg", "JPG"];  // hosts are case-sensitive
  var PHOTO_MAX = 300;
  var PHOTO_GAP = 10;                   // stop after this many numbers in a row with no picture

  // Ice physics tuning
  var FRICTION = 0.5;       // share of linear speed kept per second (low = slippery)
  var SPIN_FRICTION = 0.35; // share of spin kept per second
  var STOP_SPEED = 4;       // px/s below which a polaroid comes to rest
  var STOP_SPIN = 2;        // deg/s below which spin stops
  var PAIR_BOUNCE = 0.6;    // energy kept after hitting another polaroid
  var MAX_SPEED = 900;      // px/s cap
  var FALL_MIN = 21;        // px/s slowest fall (rain)
  var FALL_MAX = 24;        // px/s fastest fall (rain)
  var UPRIGHT_K = 6;        // how strongly a polaroid springs back to level
  var UPRIGHT_D = 3;        // damping on that spring
  var REDUCED = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  var stage = document.getElementById("stage");
  var photos = [];
  var uses = [];                       // how many polaroids show each photo
  var items = [];
  var W = 0, H = 0, base = 0;
  var topZ = 10;
  var spawnCount = 0;

  function rand(a, b){ return a + Math.random() * (b - a); }
  // Columns about one polaroid wide. New polaroids take turns across the columns (so none pile up),
  // with the left-hand columns getting a few more turns.
  var columnOrder = [], columnCount = 0, columnTurn = 0;
  function buildColumnOrder(cols){
    columnCount = cols;
    columnOrder = [];
    for (var c = 0; c < cols; c++){
      var turns = 1 + Math.round(2 * (1 - c / cols));
      for (var r = 0; r < turns; r++) columnOrder.push(c);
    }
    for (var i = columnOrder.length - 1; i > 0; i--){
      var j = Math.floor(Math.random() * (i + 1));
      var t = columnOrder[i]; columnOrder[i] = columnOrder[j]; columnOrder[j] = t;
    }
    columnTurn = 0;
  }
  function randX(){
    var cols = Math.max(1, Math.floor(W / (base * 0.9)));
    if (cols !== columnCount) buildColumnOrder(cols);
    var k = columnOrder[columnTurn++ % columnOrder.length];
    return (k + 0.5) * W / cols + rand(-base * 0.06, base * 0.06);
  }

  // Frame size from the item's scale, shape and hold growth. Scales with the window.
  function applySize(it){
    var FW = base * it.s * it.g;
    var pad = FW * 0.06;
    var imgW = FW - pad * 2;
    var imgH = imgW / it.ratio;
    var FH = pad + imgH + FW * 0.22;
    it.FW = FW; it.FH = FH;
    it.m = FW * FH;                          // mass
    it.rad = 0.5 * Math.hypot(FW, FH) * 0.62; // collision radius (smaller = more tightly packed)
    it.el.style.width = FW + "px";
    it.el.style.height = FH + "px";
    it.el.style.padding = pad + "px " + pad + "px " + (FW * 0.22) + "px";
    it.ph.style.height = imgH + "px";
  }

  // Half-size of the rotated frame's bounding box.
  function halfExtents(it){
    var r = it.a * Math.PI / 180;
    var c = Math.abs(Math.cos(r)), s = Math.abs(Math.sin(r));
    return { hw: (c * it.FW + s * it.FH) / 2, hh: (s * it.FW + c * it.FH) / 2 };
  }

  // Creates one polaroid's element and state (not yet positioned or added to the list).
  function makeItem(i){
    var el = document.createElement("div");
    el.className = "polaroid";
    el.style.zIndex = Math.floor(rand(1, 9));
    var ph = document.createElement("div");
    ph.className = "placeholder";
    var img = document.createElement("img");
    img.className = "photo";
    img.alt = "";
    img.draggable = false;
    img.decoding = "async";
    ph.appendChild(img);
    el.appendChild(ph);
    stage.appendChild(el);

    var it = {
      el: el, ph: ph,
      ratio: 1,
      index: i,
      hasPhoto: false,
      img: img,
      s: rand(0.45, 1.35),
      g: 1,
      solid: Math.random() < SOLID_SHARE,
      x: 0, y: 0, tilt: rand(-9, 9), a: 0,
      fall: rand(FALL_MIN, FALL_MAX),
      vx: 0, vy: 0, om: rand(-10, 10),
      dragging: false, drag: null,
      entered: false,
      entering: false,
      FW: 1, FH: 1, m: 1, rad: 1
    };
    it.a = it.tilt;
    attachDrag(it);
    return it;
  }

  // Sizes follow the window; positions keep their relative place when the window changes.
  function layout(){
    var oldW = W, oldH = H;
    W = stage.clientWidth;
    H = stage.clientHeight;
    // Bigger polaroids on phones, smaller on desktop.
    // Phones: sized to the screen width (about 38% of the shorter side, never wider than 42% of the width). Desktop: sized to the screen area.
    base = MOBILE ? Math.max(90, Math.min(Math.min(W, H) * 0.38, W * 0.42)) : Math.min(180, Math.max(40, Math.sqrt(W * H) * 0.075));
    items.forEach(function(it){
      if (oldW){ it.x *= W / oldW; it.y *= H / oldH; }
      applySize(it);
    });
  }

  // Scatter the polaroids across the screen: each new one goes where it is farthest from the others.
  function place(){
    var placed = [];
    items.forEach(function(it){
      var best = null, bestScore = -Infinity;
      for (var t = 0; t < 40; t++){
        var x = randX(), y = rand(0, H), score = Infinity;
        placed.forEach(function(p){
          var gap = Math.hypot(x - p.x, y - p.y) - (it.rad + p.rad);
          if (gap < score) score = gap;
        });
        if (score > bestScore){ bestScore = score; best = { x: x, y: y }; }
      }
      it.x = best.x; it.y = best.y;
      it.vx = 0; it.vy = it.fall;
      placed.push(it);
    });
  }

  function isOffScreen(it){
    var e = halfExtents(it);
    return it.x + e.hw < 0 || it.x - e.hw > W || it.y + e.hh < 0 || it.y - e.hh > H;
  }

  function removeItem(it){
    var i = items.indexOf(it);
    if (i !== -1) items.splice(i, 1);
    it.el.remove();
  }

  function scheduleSpawn(){
    setTimeout(spawnItem, rand(SPAWN_DELAY[0], SPAWN_DELAY[1]));
  }

  // A new polaroid falls in from above the top edge.
  function spawnItem(){
    // At the limit: wait a moment and try again, so a new one comes in as soon as one leaves.
    if (items.length >= MAX_ITEMS){ setTimeout(spawnItem, 250); return; }
    var it = makeItem(spawnCount++);
    it.solid = true;
    it.entering = true;
    applySize(it);
    attachPhoto(it);
    var e = halfExtents(it);
    it.x = randX();
    it.y = -e.hh - SPAWN_MARGIN;
    it.vx = rand(-3, 3);
    it.vy = it.fall;

    items.push(it);
    draw();
    kick();
    scheduleSpawn();
  }

  // Advances the simulation. Returns true while anything is still moving.
  function step(dt){
    var fr = Math.pow(FRICTION, dt);
    var sf = Math.pow(SPIN_FRICTION, dt);

    var grew = false;
    items.forEach(function(it){
      var target = it.dragging ? HOLD_GROW : 1;
      if (Math.abs(target - it.g) > 0.001){
        it.g += (target - it.g) * Math.min(1, dt * 12);
        if (Math.abs(target - it.g) <= 0.001) it.g = target;
        applySize(it);
        grew = true;
      }
    });

    items.forEach(function(it){
      if (it.dragging) return;
      it.vx *= fr; it.vy *= fr;
      it.om += (-UPRIGHT_K * (it.a - it.tilt) - UPRIGHT_D * it.om) * dt; // spring back to its tilt
      it.om *= sf;
      if (Math.hypot(it.vx, it.vy) < STOP_SPEED){ it.vx = 0; it.vy = 0; }
      if (Math.abs(it.a - it.tilt) < 0.05 && Math.abs(it.om) < STOP_SPIN){ it.a = it.tilt; it.om = 0; }
      var sp = Math.hypot(it.vx, it.vy);
      if (sp > MAX_SPEED){ it.vx *= MAX_SPEED / sp; it.vy *= MAX_SPEED / sp; }
      // Every polaroid keeps falling, including new ones still entering from above,
      // so none can stall off the top of the screen.
      var k = Math.min(1, dt * 1.5);
      it.vy += (it.fall - it.vy) * k;   // ease toward the fall speed
      it.vx += (0 - it.vx) * k;         // and straight down
      it.x += it.vx * dt;
      it.y += it.vy * dt;
      it.a += it.om * dt;
    });

    // Polaroids that have fully left the screen are removed, and a replacement is queued.
    items.slice().forEach(function(it){
      if (it.dragging) return;
      if (!isOffScreen(it)) it.entered = true;
      else if (it.entered) removeItem(it);
    });

    return grew || items.some(function(it){
      return it.dragging || it.vx !== 0 || it.vy !== 0 || it.om !== 0;
    });
  }

  function draw(){
    items.forEach(function(it){
      var tx = it.x - it.FW / 2, ty = it.y - it.FH / 2;
      it.el.style.transform = "translate3d(" + tx.toFixed(1) + "px," + ty.toFixed(1) + "px,0) rotate(" + it.a.toFixed(2) + "deg)";
    });
  }

  // The animation loop runs only while something moves, so resting polaroids stay perfectly still.
  var running = false, last = 0;
  function kick(){
    if (running) return;
    running = true;
    last = 0;
    requestAnimationFrame(frame);
  }
  function frame(ts){
    if (!last) last = ts;
    var dt = Math.min(0.033, (ts - last) / 1000);
    last = ts;
    var moving = step(dt);
    draw();
    if (moving) requestAnimationFrame(frame);
    else running = false;
  }

  // Dragging: the polaroid follows the pointer and keeps the release speed (a flick).
  function attachDrag(it){
    it.el.addEventListener("pointerdown", function(e){
      e.preventDefault();
      it.drag = {
        id: e.pointerId,
        ox: e.clientX - it.x, oy: e.clientY - it.y,
        lx: e.clientX, ly: e.clientY, lt: performance.now(),
        vx: 0, vy: 0
      };
      it.el.setPointerCapture(e.pointerId);
      it.dragging = true;
      it.vx = 0; it.vy = 0; it.om = 0;
      it.el.style.zIndex = ++topZ;
      it.el.classList.add("dragging");
      kick();
    });
    it.el.addEventListener("pointermove", function(e){
      var d = it.drag;
      if (!d || e.pointerId !== d.id) return;
      var now = performance.now();
      var dt = Math.max(1, now - d.lt) / 1000;
      var mvx = (e.clientX - d.lx) / dt, mvy = (e.clientY - d.ly) / dt;
      d.vx = d.vx * 0.5 + mvx * 0.5;
      d.vy = d.vy * 0.5 + mvy * 0.5;
      d.lx = e.clientX; d.ly = e.clientY; d.lt = now;
      it.x = e.clientX - d.ox;
      it.y = e.clientY - d.oy;
      draw();
      kick();
    });
    function release(e){
      var d = it.drag;
      if (!d || e.pointerId !== d.id) return;
      var sp = Math.hypot(d.vx, d.vy);
      if (sp > MAX_SPEED){ d.vx *= MAX_SPEED / sp; d.vy *= MAX_SPEED / sp; }
      it.vx = d.vx;
      it.vy = d.vy;
      it.om = rand(-15, 15);
      it.drag = null;
      it.dragging = false;
      it.el.classList.remove("dragging");
      kick();
    }
    it.el.addEventListener("pointerup", release);
    it.el.addEventListener("pointercancel", release);
  }

  var CACHE_NAME = "polaroid-photos-v1";
  var KNOWN_KEY = "polaroid-known-photos";

  function imageRatio(src){
    return new Promise(function(resolve){
      var img = new Image();
      img.onload = function(){ resolve((img.naturalWidth / img.naturalHeight) || 1); };
      img.onerror = function(){ resolve(null); };
      img.src = src;
    });
  }

  // Loads a photo through the browser's cache storage, so it is kept for the next visit.
  async function fetchPhoto(url){
    var cache = await caches.open(CACHE_NAME);
    var res = await cache.match(url);
    if (!res){
      res = await fetch(url);
      if (!res.ok) return null;
      await cache.put(url, res.clone());
    }
    var objectUrl = URL.createObjectURL(await res.blob());
    var ratio = await imageRatio(objectUrl);
    return ratio ? { url: objectUrl, ratio: ratio, source: url } : null;
  }

  // Same result without cache storage (for browsers or pages where it is unavailable).
  async function loadPlainPhoto(url){
    var ratio = await imageRatio(url);
    return ratio ? { url: url, ratio: ratio, source: url } : null;
  }

  async function loadPhoto(url){
    try {
      if ("caches" in window) return await fetchPhoto(url);
    } catch (e) { /* fall through to the plain loader */ }
    return loadPlainPhoto(url);
  }

  // The list of photos found last time, so they can show straight away.
  function readKnown(){
    try { return JSON.parse(localStorage.getItem(KNOWN_KEY)) || []; } catch (e) { return []; }
  }
  function writeKnown(list){
    try { localStorage.setItem(KNOWN_KEY, JSON.stringify(list)); } catch (e) { /* storage full or blocked */ }
  }
  async function findPhoto(n){
    for (var i = 0; i < PHOTO_EXTS.length; i++){
      var photo = await loadPhoto(PHOTO_FOLDER + n + "." + PHOTO_EXTS[i]);
      if (photo) return photo;
    }
    return null;
  }
  async function collectPhotos(onFound){
    var list = [], misses = 0;
    for (var n = 1; n <= PHOTO_MAX && misses < PHOTO_GAP; n++){
      var photo = await findPhoto(n);
      if (photo){
        list.push(photo);
        misses = 0;
        if (onFound) onFound(photo);
      }
      else misses++;
    }
    return list;
  }

  // Give a polaroid its photo; it fades in once the image has loaded.
  // Pick the photo shown least often so far (ties broken at random).
  function pickIndex(){
    var min = Infinity;
    uses.forEach(function(u){ if (u < min) min = u; });
    var options = [];
    uses.forEach(function(u, i){ if (u === min) options.push(i); });
    return options[Math.floor(Math.random() * options.length)];
  }

  function attachPhoto(it){
    if (!photos.length) return;
    var idx = pickIndex();
    var photo = photos[idx];
    uses[idx]++;
    it.hasPhoto = true;
    it.ratio = photo.ratio;
    // A different crop of the same photo, so repeats look less alike.
    it.img.style.objectPosition = Math.round(rand(15, 85)) + "% " + Math.round(rand(15, 85)) + "%";
    it.img.onload = function(){ it.img.classList.add("loaded"); };
    it.img.src = photo.url;
    applySize(it);
  }

  function start(){
    for (var i = 0; i < COUNT; i++) items.push(makeItem(spawnCount++));
    layout();
    place();
    items.forEach(function(it){ it.entered = true; });
    draw();
    if (!REDUCED) kick();
    scheduleSpawn();

    window.addEventListener("resize", function(){
      layout();
      draw();
      kick();
    });

    var seen = {};
    function addPhoto(photo){
      if (!photo || seen[photo.source]) return;
      seen[photo.source] = true;
      photos.push(photo);
      uses.push(0);
      var waiting = items.find(function(it){ return !it.hasPhoto; });
      if (waiting) attachPhoto(waiting);
    }

    // Photos stored from the last visit show straight away; the folder is then checked for any new ones.
    readKnown().forEach(function(url){ loadPhoto(url).then(addPhoto); });
    collectPhotos(addPhoto).then(function(list){
      writeKnown(list.map(function(p){ return p.source; }));
      // Anything still waiting once the folder is done gets a photo too.
      items.forEach(function(it){
        if (!it.hasPhoto) attachPhoto(it);
      });
    });
  }

  start();
